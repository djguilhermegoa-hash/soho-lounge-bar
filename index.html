<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cardápio Soho Lounge Bar</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #fff7ea;
      --muted: #d8c1aa;
      --line: rgba(255, 242, 222, .16);
      --gold: #d6a961;
      --gold-soft: #f0d79d;
      --brown: #1a0b08;
      --mahogany: #32100b;
      --marsala: #651b17;
      --bordeaux: #7d1618;
      --copper: #9f5730;
      --olive: #74805b;
      --panel: rgba(29, 10, 8, .72);
      --tab-w: 92px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--brown);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(135deg, rgba(26, 11, 8, .96), rgba(82, 19, 17, .94) 45%, rgba(35, 11, 8, .98)),
        radial-gradient(circle at 78% 8%, rgba(214, 169, 97, .16), transparent 28%);
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      content: "";
      opacity: .08;
      background-image:
        linear-gradient(30deg, transparent 46%, rgba(255,255,255,.35) 48%, transparent 51%),
        linear-gradient(150deg, transparent 46%, rgba(255,255,255,.22) 48%, transparent 51%);
      background-size: 96px 96px;
    }

    button {
      color: inherit;
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: var(--tab-w) minmax(0, 1fr);
      min-height: 100vh;
    }

    .tabs {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 12px 8px;
      overflow-y: auto;
      border-right: 1px solid rgba(255, 255, 255, .1);
      background: linear-gradient(180deg, rgba(22, 7, 5, .96), rgba(63, 14, 13, .96));
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      margin: 0 auto 12px;
      border: 1px solid rgba(240, 215, 157, .45);
      border-radius: 50%;
      color: var(--gold-soft);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.05rem;
      letter-spacing: .08em;
      background: rgba(255, 255, 255, .05);
    }

    .tab-list {
      display: grid;
      gap: 8px;
    }

    .tab {
      display: grid;
      justify-items: center;
      gap: 5px;
      width: 100%;
      min-height: 72px;
      padding: 9px 4px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 8px;
      background: rgba(255, 247, 234, .05);
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .tab svg {
      width: 22px;
      height: 22px;
      color: var(--gold);
      stroke-width: 1.7;
    }

    .tab span {
      max-width: 100%;
      font-size: .66rem;
      font-weight: 700;
      line-height: 1.05;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .tab[aria-selected="true"] {
      color: #1d0b08;
      border-color: rgba(240, 215, 157, .95);
      background: linear-gradient(180deg, var(--gold-soft), var(--gold));
      box-shadow: 0 10px 28px rgba(214, 169, 97, .16);
    }

    .tab[aria-selected="true"] svg {
      color: #371208;
    }

    .tab:active {
      transform: scale(.98);
    }

    .content {
      min-width: 0;
      padding: 14px 14px 28px;
    }

    .hero {
      position: relative;
      min-height: 220px;
      overflow: hidden;
      border: 1px solid rgba(240, 215, 157, .22);
      border-radius: 8px;
      background: #210b08;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .28);
    }

    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: .72;
    }

    .hero::after {
      position: absolute;
      inset: 0;
      content: "";
      background: linear-gradient(90deg, rgba(19, 6, 4, .88), rgba(61, 14, 12, .44) 58%, rgba(25, 8, 5, .18));
    }

    .hero-copy {
      position: relative;
      z-index: 1;
      display: grid;
      align-content: end;
      min-height: 220px;
      padding: 22px 16px;
    }

    .eyebrow {
      width: fit-content;
      margin: 0 0 8px;
      padding: 5px 9px;
      border: 1px solid rgba(240, 215, 157, .38);
      border-radius: 999px;
      color: var(--gold-soft);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      background: rgba(26, 11, 8, .58);
    }

    h1 {
      max-width: 100%;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2.45rem;
      line-height: .88;
      letter-spacing: 0;
      text-transform: uppercase;
      text-wrap: balance;
      overflow-wrap: anywhere;
    }

    .hero p {
      max-width: 28ch;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: .96rem;
      line-height: 1.45;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 3;
      display: grid;
      gap: 10px;
      padding: 12px 0;
      background: linear-gradient(180deg, rgba(37, 12, 9, .98) 68%, rgba(37, 12, 9, 0));
    }

    .section-title {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
    }

    .section-title h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.75rem;
      font-weight: 500;
      letter-spacing: 0;
    }

    .count {
      flex: 0 0 auto;
      color: var(--gold-soft);
      font-size: .72rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .search {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 8px;
      background: rgba(255, 247, 234, .08);
    }

    .search svg {
      width: 20px;
      height: 20px;
      color: var(--gold-soft);
    }

    .search input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      color: var(--ink);
      font: inherit;
      background: transparent;
    }

    .search input::placeholder {
      color: rgba(216, 193, 170, .74);
    }

    .subsection {
      margin: 16px 0 8px;
      color: var(--gold-soft);
      font-size: .78rem;
      font-weight: 900;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .item {
      position: relative;
      display: grid;
      gap: 5px;
      padding: 13px 12px;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 247, 234, .09), rgba(255, 247, 234, .03)),
        rgba(20, 7, 5, .68);
      box-shadow: 0 10px 28px rgba(0, 0, 0, .18);
    }

    .item::before {
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      border-radius: 8px 0 0 8px;
      content: "";
      background: linear-gradient(180deg, var(--gold), var(--copper));
    }

    .item-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 10px;
    }

    .name {
      min-width: 0;
      font-size: 1rem;
      font-weight: 800;
      line-height: 1.16;
      overflow-wrap: anywhere;
    }

    .price {
      white-space: nowrap;
      color: var(--gold-soft);
      font-size: 1rem;
      font-weight: 900;
      line-height: 1.12;
    }

    .desc {
      margin: 0;
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.35;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .tag {
      padding: 4px 7px;
      border: 1px solid rgba(116, 128, 91, .55);
      border-radius: 999px;
      color: #e8eccf;
      font-size: .66rem;
      font-weight: 800;
      background: rgba(116, 128, 91, .18);
    }

    .empty {
      display: none;
      padding: 18px 12px;
      border: 1px dashed rgba(240, 215, 157, .28);
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
      background: rgba(255, 247, 234, .04);
    }

    .footer {
      margin-top: 24px;
      padding: 18px 0 6px;
      color: rgba(216, 193, 170, .78);
      font-size: .77rem;
      line-height: 1.45;
      text-align: center;
    }

    @media (min-width: 620px) {
      :root {
        --tab-w: 124px;
      }

      .content {
        width: min(760px, 100%);
        margin: 0 auto;
        padding-inline: 22px;
      }

      .tab {
        min-height: 66px;
        grid-template-columns: 28px 1fr;
        justify-items: start;
        padding-inline: 12px;
      }

      .tab span {
        font-size: .78rem;
        text-align: left;
      }

      .hero,
      .hero-copy {
        min-height: 270px;
      }

      h1 {
        font-size: 4rem;
      }

      .list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .subsection {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>

    const tabs = document.getElementById('tabs');
    const menu = document.getElementById('menu');
    const search = document.getElementById('search');
    const title = document.getElementById('categoryTitle');
    const count = document.getElementById('itemCount');
    const empty = document.getElementById('empty');
    let activeId = categories[0].id;

    const normalize = (value) =>
      value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

    function visibleItems(category, query) {
      const normalizedQuery = normalize(query.trim());
      return category.groups.map((group) => {
        const items = group.items.filter((item) => {
          const haystack = normalize(`${item.name} ${item.desc || ''} ${item.price}`);
          return !normalizedQuery || haystack.includes(normalizedQuery);
        });
        return { ...group, items };
      }).filter((group) => group.items.length);
    }

    function renderTabs() {
      tabs.innerHTML = categories.map((category) => `
        <button class="tab" type="button" aria-selected="${category.id === activeId}" data-id="${category.id}">
          ${icons[category.icon]}
          <span>${category.label}</span>
        </button>
      `).join('');
    }

    function renderMenu() {
      const category = categories.find((item) => item.id === activeId);
      const groups = visibleItems(category, search.value);
      const total = groups.reduce((sum, group) => sum + group.items.length, 0);

      title.textContent = category.label;
      count.textContent = `${total} ${total === 1 ? 'item' : 'itens'}`;
      empty.style.display = total ? 'none' : 'block';

      menu.innerHTML = groups.map((group) => `
        <section class="menu-group">
          <h3 class="subsection">${group.title}</h3>
          <div class="list">
            ${group.items.map((item) => `
              <article class="item">
                <div class="item-head">
                  <div class="name">${item.name}</div>
                  <div class="price">${item.price}</div>
                </div>
                ${item.desc ? `<p class="desc">${item.desc}</p>` : ''}
                ${item.tag ? `<div class="tag-row"><span class="tag">${item.tag}</span></div>` : ''}
              </article>
            `).join('')}
          </div>
        </section>
      `).join('');

      renderTabs();
    }

    tabs.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-id]');
      if (!button) return;
      activeId = button.dataset.id;
      search.value = '';
      renderMenu();
      document.querySelector('.content').scrollTo({ top: 0, behavior: 'smooth' });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    search.addEventListener('input', renderMenu);
    renderTabs();
    renderMenu();
  </script>
